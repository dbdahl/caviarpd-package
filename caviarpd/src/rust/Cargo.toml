[package]
name = "rust"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.85.1"

[lib]
crate-type = ["staticlib"]

# To convert stop!() to panic!(), set RUST_BACKTRACE=1 environment variable.
[profile.release]
debug = 1
lto = "thin"

[dependencies]
rand = "0.10.0"
rand_pcg = "0.10.0"
rand_distr = "0.6.0"
crossbeam = "0.8.4"
roots = "0.0.8"
dahl-salso = { git="https://github.com/dbdahl/rust-dahl-salso.git", rev="cdabc9c" }
epa = { path = "epa" }
roxido = { path = "roxido" }
